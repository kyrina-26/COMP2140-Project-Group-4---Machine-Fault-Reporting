services:
  # MySQL database; its named volume keeps records when the container stops.
  mysql:
    container_name: machine-fault-mysql
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "3306"
    networks:
      - database_internal
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Static frontend served by Nginx.
  frontend:
    container_name: machine-fault-frontend
    image: nginx:alpine
    environment:
      API_CONTAINER_PORT: ${API_CONTAINER_PORT}
    ports:
      - "127.0.0.1:8080:80"
    expose:
      - "80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    networks:
      - nginx_proxy
      - app_internal
    restart: unless-stopped

  # Java REST API; Docker compiles it from backend/ before starting it.
  api:
    container_name: machine-fault-api
    image: ${API_IMAGE}
    build:
      context: ./backend
    environment:
      PORT: ${API_CONTAINER_PORT}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR}
      APP_MAX_FILE_SIZE: ${APP_MAX_FILE_SIZE}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS}
    expose:
      - "${API_CONTAINER_PORT}"
    networks:
      - app_internal
      - database_internal
    volumes:
      - fault_uploads:${APP_UPLOAD_DIR}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Persistent local data stores for database records and uploaded media.
  fault_uploads:
    name: machine_fault_uploads
  mysql_data:
    name: machine_fault_mysql_data

networks:
  # NPM reaches only the frontend through this pre-existing external network.
  nginx_proxy:
    name: nginx_proxy
    external: true
  # Keep app and database traffic isolated from the public proxy network.
  app_internal:
    name: machine_fault_internal
    internal: true
  database_internal:
    name: machine_fault_database
    internal: true
