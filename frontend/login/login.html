<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/shared/images/favicon.ico" sizes="any">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Machine Fault Reporting System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Factory image section -->
        <div class="factory-section">
            <div class="image-overlay"></div>
        </div>

        <!-- Login section -->
        <div class="login-card">

            <div class="logo">
                <span>⚙️</span>
            </div>

            <h1>Machine Fault Reporting</h1>

            <h2>Maintenance Response System</h2>

            <div class="orange-line"></div>

            <form id="loginForm">

                <label for="username">Username</label>

                <div class="input-group">
                    <span>👤</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <label for="password">Password</label>

                <div class="input-group">
                    <span>🔒</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    ⇥ LOGIN
                </button>

                <p id="loginMessage" role="status" aria-live="polite"></p>

            </form>

        </div>

    </div>

    <script src="login.js" defer></script>

</body>
</html>
