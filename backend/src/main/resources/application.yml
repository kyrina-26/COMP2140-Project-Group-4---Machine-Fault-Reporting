spring:
  application:
    name: machine-fault-api
  # Authentication is handled by the database-backed API login, not Boot's generated in-memory user.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # These upload limits are supplied by the root .env file through Docker Compose.
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE}
      max-request-size: ${APP_MAX_REQUEST_SIZE}
  # Database address and credentials are passed into the container as environment variables.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # Create missing tables from schema.sql, then verify that the Java entities match the schema.
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
server:
  # API port comes from the Compose environment.
  port: ${PORT}
  servlet:
    # End a login session after 30 minutes without activity.
    session:
      timeout: 30m
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  uploads:
    directory: ${APP_UPLOAD_DIR}
    max-file-size: ${APP_MAX_FILE_SIZE}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS}
